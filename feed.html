<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#0d2038;--mute:#53647c;--line:#dbe3ee;--blue:#1d4ed8;--blue-d:#173fb0;--sun:#ffc533;--ok:#0b8a5b;--heart:#e11d48;--soft:#eaf0f8}
@media(prefers-color-scheme:dark){:root{--bg:#0a1424;--card:#111f36;--ink:#eaf1fb;--mute:#9db0c8;--line:#22344f;--blue:#5b8cff;--blue-d:#82a6ff;--ok:#3ddc97;--heart:#fb7185;--soft:#182946}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.55 "Hanken Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Hanken Grotesk",sans-serif;line-height:1.15;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
img,video{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.feed-wrap{max-width:580px;margin:0 auto;padding:18px 16px 64px}
.feed-wrap.is-grid{max-width:960px}

/* Sticky frosted header matching index.html */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.brand-row{display:flex;align-items:center;gap:16px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem "Bricolage Grotesque",sans-serif;flex:none}
.brand i{font-style:normal;color:var(--blue)}
.brand svg{flex:none}
.top-nav{display:flex;align-items:center;gap:14px;font-size:.92rem;font-weight:600;color:var(--mute)}
.top-nav a:hover{color:var(--ink)}
.top-nav a[aria-current="page"]{color:var(--blue);font-weight:700}
@media(max-width:740px){.top-nav{display:none}}

.nav-controls{display:flex;align-items:center;gap:8px;min-width:0}
.seg{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:999px;font-size:.86rem;font-weight:700;color:var(--mute);transition:background .15s,color .15s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
@media(prefers-color-scheme:dark){.seg button[aria-pressed="true"]{color:#06122a}}

.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);transition:border-color .15s,transform .15s;flex:none}
.icon-btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Minimal SEO heading, status + active filter bar */
.seo-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.feed-h1{font-size:1.22rem;font-weight:800}
.feed-sub{font-size:.82rem;color:var(--mute);font-weight:500}
.meta-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.status-pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);flex:none}
.dot.is-err{background:var(--heart);box-shadow:0 0 0 3px color-mix(in srgb,var(--heart) 22%,transparent)}
.dot.is-demo{background:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 28%,transparent)}
.bar-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;color:var(--ink)}
.chip.active-tag{border-color:var(--blue);color:var(--blue)}
.chip svg{width:14px;height:14px}

/* Mobile filter strip */
.mob-filters{display:none}
@media(max-width:620px){
  .bar .seg.filter-seg{display:none}
  .mob-filters{display:flex;justify-content:center;padding:8px 16px 10px;border-top:1px solid var(--line)}
  .mob-filters .seg{width:100%;justify-content:space-between}
  .mob-filters .seg button{flex:1;text-align:center}
}

/* Stream Cards */
.stream{display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .2s,box-shadow .2s;scroll-margin-top:84px}
.card:focus-within,.card.is-current,.card:target{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}

.card-head{display:flex;align-items:center;gap:11px;padding:12px 14px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--soft);flex:none}
.avatar-fallback{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2f6bff,#102a8f);color:#fff;display:grid;place-items:center;font:800 .95rem "Bricolage Grotesque",sans-serif;flex:none}
.creator{min-width:0;flex:1}
.creator-row{display:flex;align-items:center;gap:6px}
.username{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbadge{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--blue);color:#fff;font-size:9px;flex:none}
.subline{font-size:.78rem;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post-link{color:var(--blue);font-weight:700}
.post-link:hover{text-decoration:underline}
.type-badge{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mute);flex:none}
.type-badge.is-video{background:color-mix(in srgb,var(--sun) 28%,var(--soft));color:var(--ink)}

/* Media Stage */
.stage{position:relative;background:#050b16;display:grid;place-items:center;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;min-height:220px}
.stage video,.stage img{width:100%;max-height:76vh;object-fit:contain;background:#050b16}
.stage.is-photo{cursor:zoom-in}
.stage.is-video{cursor:pointer}

.stage-top{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:4}
.pill-ctrl{background:rgba(10,20,36,.72);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:6px 10px;font-size:.78rem;font-weight:700;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.16)}
.pill-ctrl svg{width:14px;height:14px}

.dur-badge{position:absolute;top:10px;left:10px;background:rgba(10,20,36,.72);backdrop-filter:blur(6px);color:#fff;font-size:.75rem;font-weight:700;padding:4px 8px;border-radius:8px;pointer-events:none;z-index:4}

.play-flash{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(10,20,36,.72);color:#fff;display:grid;place-items:center;pointer-events:none;opacity:0;transform:scale(.75);transition:opacity .18s,transform .18s;z-index:5}
.play-flash.show{opacity:1;transform:scale(1)}
.play-flash svg{width:26px;height:26px}

.heart-burst{position:absolute;pointer-events:none;z-index:6;color:#fff;filter:drop-shadow(0 6px 20px rgba(225,29,72,.55));opacity:0;transform:scale(.4)}
.heart-burst.pop{animation:burst .72s cubic-bezier(.18,.89,.32,1.28) forwards}
@keyframes burst{
  0%{opacity:0;transform:scale(.35)}
  30%{opacity:1;transform:scale(1.18)}
  70%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.35)}
}

.prog-wrap{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18);z-index:5;cursor:pointer}
.prog-fill{height:100%;width:0;background:var(--sun);transition:width .08s linear}

/* Action Bar + Caption */
.actions{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;gap:8px}
.act-left{display:flex;align-items:center;gap:14px}
.act-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 2px;font-size:.9rem;font-weight:700;color:var(--ink);transition:transform .12s,color .12s}
.act-btn:active{transform:scale(.92)}
.act-btn svg{width:21px;height:21px}
.act-btn.liked{color:var(--heart)}
.act-btn.liked svg{fill:var(--heart);stroke:var(--heart)}
.views-pill{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;color:var(--mute)}
.views-pill svg{width:15px;height:15px}

.caption-box{padding:4px 14px 14px;font-size:.95rem;line-height:1.5}
.caption-title{font-family:"Bricolage Grotesque","Hanken Grotesk",sans-serif;font-size:1.02rem;font-weight:700;margin-bottom:3px;color:var(--ink)}
.caption-user{font-weight:700;margin-right:6px}
.tag-link{color:var(--blue);font-weight:600}
.tag-link:hover{text-decoration:underline}
.more-btn{color:var(--mute);font-weight:700;margin-left:4px;font-size:.86rem}

/* Instagram 3-col Grid Mode */
.grid-view{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:600px){.grid-view{grid-template-columns:repeat(2,1fr);gap:6px}}
.tile{position:relative;aspect-ratio:4/5;background:#081120;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tile-media-btn{display:block;width:100%;height:100%;padding:0}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.tile:hover img,.tile:hover video{transform:scale(1.03)}
.tile-badge{position:absolute;top:8px;right:8px;background:rgba(10,20,36,.75);color:#fff;border-radius:8px;padding:3px 7px;font-size:.74rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;pointer-events:none}
.tile-foot{position:absolute;left:0;right:0;bottom:0;padding:24px 9px 8px;background:linear-gradient(transparent,rgba(6,12,24,.9));color:#fff;font-size:.78rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile-foot:hover .tile-title{text-decoration:underline}
.tile-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;min-width:0}
.tile-views{white-space:nowrap;flex:none}

/* Skeleton & Empty States */
.skel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.skel-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pulse{background:linear-gradient(90deg,var(--soft) 25%,color-mix(in srgb,var(--line) 70%,var(--soft)) 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-av{width:38px;height:38px;border-radius:50%}
.skel-ln{height:12px;border-radius:6px;width:45%}
.skel-media{height:340px;border-radius:12px}

.empty-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 22px;text-align:center}
.empty-box h2{font-size:1.35rem;margin-bottom:8px}
.empty-box p{color:var(--mute);max-width:48ch;margin:0 auto 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;font-weight:700;padding:10px 20px;border-radius:11px;font-size:.94rem;transition:background .15s,transform .15s}
.btn:hover{background:var(--blue-d);transform:translateY(-1px)}
@media(prefers-color-scheme:dark){.btn{color:#06122a}}

/* Modals */
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,10,20,.84);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(520px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:1.05rem}
.modal-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.comment-item{display:flex;gap:10px;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid var(--line)}
.comment-item:last-child{border-bottom:0;padding-bottom:0}
.lightbox-img{max-width:94vw;max-height:88vh;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.lightbox-close{position:fixed;top:16px;right:16px;width:42px;height:42px;border-radius:50%;background:rgba(15,23,42,.82);color:#fff;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:20px;z-index:90}

/* Toast & Footer */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.86rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.top-fab{position:fixed;right:18px;bottom:22px;z-index:35;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 26px rgba(13,32,56,.15);border-radius:999px;padding:9px 14px;font-size:.84rem;font-weight:700;display:none;align-items:center;gap:6px}
.top-fab.show{display:inline-flex}
.end-note{text-align:center;color:var(--mute);font-size:.84rem;margin-top:20px}
footer{border-top:1px solid var(--line);padding:26px 16px;color:var(--mute);font-size:.86rem;text-align:center}
.foot-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:8px;font-weight:600}
.foot-links a:hover{color:var(--ink);text-decoration:underline}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="brand-row">
      <a class="brand" href="#top" id="brandTop">
        <svg class="fs" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#102a8f"/></linearGradient></defs>
          <rect width="40" height="40" rx="11" fill="url(#g)"/>
          <path d="M5 31 Q20 24 35 8 Q27 24 12 33Z" fill="#ffc533"/>
          <text x="9" y="26" font-family="Bricolage Grotesque,Arial,sans-serif" font-weight="800" font-size="18" fill="#fff">FS</text>
        </svg>
        <span>falconspido<i>.com</i></span>
      </a>
      <nav class="top-nav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/feed" aria-current="page">Feed</a>
      </nav>
    </div>

    <div class="nav-controls">
      <div class="seg filter-seg" role="group" aria-label="Filter media">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="video" aria-pressed="false">Videos</button>
        <button type="button" data-filter="image" aria-pressed="false">Photos</button>
      </div>

      <div class="seg" role="group" aria-label="Layout mode">
        <button type="button" data-view="stream" aria-pressed="true" title="Scrollable Feed">Feed</button>
        <button type="button" data-view="grid" aria-pressed="false" title="Instagram Grid">Grid</button>
      </div>

      <button type="button" class="icon-btn" id="refreshBtn" title="Refresh feed" aria-label="Refresh feed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>
  </div>

  <div class="mob-filters">
    <div class="seg" role="group" aria-label="Mobile media filter">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="video" aria-pressed="false">Videos</button>
      <button type="button" data-filter="image" aria-pressed="false">Photos</button>
    </div>
  </div>
</header>

<main id="top" class="feed-wrap">
  <div class="seo-head">
    <h1 class="feed-h1">Latest Photos &amp; Videos</h1>
    <span class="feed-sub">Newest first · 25 Nov 2026+</span>
  </div>
  <div class="meta-bar">
    <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">Loading Vercel feed…</span></div>
    <div class="bar-actions">
      <button type="button" class="chip active-tag" id="tagClearBtn" hidden></button>
      <button type="button" class="chip" id="globalMuteBtn" aria-pressed="true"></button>

  function safeUrl(raw) {
    if (!raw || typeof raw !== "string") return "";
    var s = raw.trim();
    if (/^https?:\/\//i.test(s)) return s;
    if (/^data:image\/(png|jpe?g|webp|gif|svg\+xml)[;,]/i.test(s)) return s;
    if (s.startsWith("/videos/") || s.startsWith("/assets/")) return s;

  }

  function parsePostTimestampMs(post) {
    var ts = Date.parse(post && post.createdAt);
    if (isFinite(ts)) return ts;
    var id = String((post && post._id) || "");
    if (/^[a-f0-9]{24}$/i.test(id)) {
      return parseInt(id.slice(0, 8), 16) * 1000;
    }
    return NaN;
  }

  function classifyPost(post) {
    if (!post || !post._id) return null;
    var ts = parsePostTimestampMs(post);
    if (!isFinite(ts)) return null;
    if (!SHOW_ALL_DATES && ts < API_CONFIG.cutoffMs) return null;

    var mediaUrl = safeUrl(post.media || post.mediaUrl || (post.medias && post.medias.url) || "");
    if (!mediaUrl) return null;
    if (/(youtube\.com|youtu\.be)/i.test(mediaUrl)) return null;

    var mt = String(post.mediaType || "").toLowerCase();
    var isVideo = mt.startsWith("video") || /\.(mp4|mov|webm|mkv|m4v)(\?|#|$)/i.test(mediaUrl);
    var isPhoto = !isVideo && (mt.startsWith("image") || /^data:image\//i.test(mediaUrl) || /\.(jpe?g|png|webp|gif|avif|bmp|svg)(\?|#|$)/i.test(mediaUrl));

    if (!isVideo && !isPhoto) return null;

    return {
      id: String(post._id),
      kind: isVideo ? "video" : "image",
      mediaUrl: mediaUrl,
      thumbUrl: safeUrl(post.thumbnail || (isPhoto ? mediaUrl : "")),
      title: String(post.title || "").trim(),
      description: String(post.description || "").trim(),
      tags: Array.isArray(post.tags) ? post.tags.map(function (t) { return String(t || "").replace(/^#+/, "").trim(); }).filter(Boolean) : [],
      location: String(post.location || "").trim(),
      duration: Number(post.duration || 0),
      views: Number(post.views || 0),
      likesCount: Array.isArray(post.likes) ? post.likes.length : Number(post.likes || 0),
      comments: Array.isArray(post.comments) ? post.comments : [],
      createdAt: post.createdAt || new Date(ts).toISOString(),
      createdMs: ts,
      user: {
        username: String((post.userId && (post.userId.username || post.userId.name)) || "falconspido"),
        avatar: safeUrl(post.userId && (post.userId.profilePicture || post.userId.profilePic || post.userId.avatar)),
        verified: Boolean(post.userId && (post.userId.isVerified || post.userId.isEmailVerified))
      }
    };
  }

  function formatDuration(sec) {
    var s = Math.max(0, Math.round(sec || 0));
    if (!s) return "";
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function formatIsoDuration(sec) {
    var s = Math.max(0, Math.round(sec || 0));
    if (!s) return undefined;
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var r = s % 60;
    return "PT" + (h ? h + "H" : "") + (m ? m + "M" : "") + (r || (!h && !m) ? r + "S" : "");
  }

  function formatTimeAgo(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diffSec < 60 && diffSec >= 0) return "just now";
    if (diffSec < 3600 && diffSec >= 0) return Math.floor(diffSec / 60) + "m";
    if (diffSec < 86400 && diffSec >= 0) return Math.floor(diffSec / 3600) + "h";
    return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Kolkata" });
  }

        if (isoDur) vidObj.duration = isoDur;

      return {
        "@type": "ListItem",

          "name": "Feed — Latest Photos & Videos | falconspido.com",
          "url": "https://www.falconspido.com/feed",
          "description": "Latest photos, short videos, and creator reels on falconspido.com sorted newest-first.",

  function normalizeAndSortPosts(rawList) {
    var seen = new Set();
    var out = [];
    for (var i = 0; i < rawList.length; i++) {
      var norm = classifyPost(rawList[i]);
      if (norm && !seen.has(norm.id)) {
        seen.add(norm.id);
        out.push(norm);
      }
    }
    out.sort(function (a, b) {
      if (b.createdMs !== a.createdMs) return b.createdMs - a.createdMs;
      return b.id.localeCompare(a.id);
    });
    return out;
  }

  async function loadBackendFeed(forceNetwork) {
    if (state.loading) return;
    state.loading = true;
    state.error = "";
    refreshBtn.classList.add("spinning");

    if (!forceNetwork && HAS_SSR_POSTS) {
      state.sourceMode = "ssr";
      state.allPosts = normalizeAndSortPosts(window.__INITIAL_FEED_POSTS__);
      state.loading = false;
      refreshBtn.classList.remove("spinning");
      renderFeed();
      focusTargetedPost();
      return;
    }

    renderSkeletons();

    try {
      // Check same-origin server proxy first if running inside aijobsearch server without ?api=
      if (!queryApi && params.get("local") !== "1" && params.get("demo") !== "1" && !isFileProto) {
        try {
          var proxyRes = await fetch("/api/feed", { cache: "no-store" });
          if (proxyRes.ok) {
            var proxyData = await proxyRes.json();
            if (proxyData.mode === "live" && Array.isArray(proxyData.posts) && proxyData.posts.length) {
              state.sourceMode = "live";
              state.allPosts = normalizeAndSortPosts(proxyData.posts);
              return;
            }
          }
        } catch (_) {}
      }

      if (IS_DUMMY_MODE) {
        state.sourceMode = "dummy";
        state.allPosts = normalizeAndSortPosts(DEMO_RAW_POSTS);
        return;
      }

      state.sourceMode = "live";
      var rawAll = [];
      var page = 1;
      var keepGoing = true;
      var MAX_PAGES = 20;

      while (keepGoing && page <= MAX_PAGES) {
        var url = API_BASE + API_CONFIG.feedPath + "?page=" + page + "&limit=50";
        var res = await fetch(url, { cache: "no-store" });
        if (!res.ok) {
          var snippet = "";
          try { snippet = (await res.text()).slice(0, 140); } catch (_) {}
          throw new Error(
            snippet.indexOf("FUNCTION_INVOCATION_FAILED") !== -1
              ? "Vercel (" + API_BASE + ") returned HTTP " + res.status + " (FUNCTION_INVOCATION_FAILED)."
              : "Vercel API (" + API_BASE + ") returned HTTP " + res.status
          );
        }
        var data = await res.json();
        var batch = Array.isArray(data) ? data : (Array.isArray(data.posts) ? data.posts : []);
        if (!batch.length) break;

        var hitOlder = false;
        for (var i = 0; i < batch.length; i++) {
          rawAll.push(batch[i]);
          var ts = parsePostTimestampMs(batch[i]);
          if (!SHOW_ALL_DATES && isFinite(ts) && ts < API_CONFIG.cutoffMs && !(batch[i] && batch[i].isPinned)) {
            hitOlder = true;
          }
        }

        if (hitOlder || !data.hasMore) {
          keepGoing = false;
        } else {
          page++;
        }
      }

      state.allPosts = normalizeAndSortPosts(rawAll);
    } catch (err) {
      var rawMsg = (err && err.message) ? err.message : "Unable to load feed";
      if (/failed to fetch|networkerror|load failed/i.test(rawMsg) && API_BASE.indexOf("vercel.app") !== -1) {
        state.error = "Vercel backend (" + API_BASE + ") failed to respond with CORS/200. Check your Vercel deployment or pass ?demo=1 / ?api=...";
      } else {
        state.error = rawMsg;
      }
    } finally {
      state.loading = false;
      refreshBtn.classList.remove("spinning");
      renderFeed();
      focusTargetedPost();
    }
  }

  function focusTargetedPost() {
    var targetId = (params.get("post") || "").trim();
    if (!targetId && window.location.hash && window.location.hash.indexOf("#post-") === 0) {

    if (!targetId) return;
    var el = document.getElementById("post-" + targetId);
    if (el) {
      el.classList.add("is-current");
      el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

        var inTags = p.tags.some(function (t) { return t.toLowerCase() === needle; });
        var inTitle = p.title.toLowerCase().indexOf("#" + needle) !== -1;
        if (!inTags && !inTitle) return false;
      }
      return true;
    });

  function svgIcon(pathHtml, viewBox) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", viewBox || "0 0 24 24");
    s.setAttribute("fill", "none");
    s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "2");
    s.setAttribute("stroke-linecap", "round");
    s.setAttribute("stroke-linejoin", "round");

  function buildCaptionNodes(post, container) {
    if (post.title) {
      var h2 = document.createElement("h2");
      h2.className = "caption-title";
      h2.textContent = post.title.replace(/#[\p{L}\p{N}_]+/gu, "").replace(/\s+/g, " ").trim() || post.title;
      container.appendChild(h2);
    }

    var uSpan = document.createElement("span");
    uSpan.className = "caption-user";
    uSpan.textContent = post.user.username;
    container.appendChild(uSpan);

    var rawText = (post.description && post.description !== post.title) ? post.description : (post.title || "");
    if (!rawText) return;

    if (post.tags.length && rawText.indexOf("#") === -1) {
      rawText += " " + post.tags.map(function (t) { return "#" + t; }).join(" ");
    }

    var expanded = state.expandedIds.has(post.id);
    var limit = 160;
    var isLong = rawText.length > limit;
    var display = (!expanded && isLong) ? rawText.slice(0, limit).trim() + "…" : rawText;

    var parts = display.split(/(#[\p{L}\p{N}_]+)/gu);
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) continue;
      if (part.charAt(0) === "#" && part.length > 1) {
        (function (cleanTag, label) {
          var tBtn = document.createElement("button");
          tBtn.type = "button";
          tBtn.className = "tag-link";
          tBtn.textContent = label;
          tBtn.addEventListener("click", function () {
            state.tagFilter = cleanTag;
            renderFeed();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          container.appendChild(tBtn);
        })(part.slice(1), part);
      } else {
        container.appendChild(document.createTextNode(part));
      }
    }

    if (isLong) {
      var mBtn = document.createElement("button");
      mBtn.type = "button";
      mBtn.className = "more-btn";
      mBtn.textContent = expanded ? "less" : "more";
      mBtn.addEventListener("click", function () {
        if (state.expandedIds.has(post.id)) state.expandedIds.delete(post.id);
        else state.expandedIds.add(post.id);
        renderFeed();
      });
      container.appendChild(mBtn);
    }
  }

  function setupObservers() {
    if (videoObserver) videoObserver.disconnect();
    if (viewTrackerObserver) viewTrackerObserver.disconnect();

    videoObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var vid = entry.target;
        if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
          vid.muted = state.muted;
          vid.play().catch(function () {});
        } else {
          vid.pause();
        }
      });
    }, { threshold: [0.25, 0.6] });

    viewTrackerObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var postId = entry.target.getAttribute("data-post-id");
        if (!postId || state.viewedIds.has(postId)) return;
        state.viewedIds.add(postId);
        if (state.sourceMode === "live" && API_BASE !== DUMMY_VERCEL_API) {
          fetch(API_BASE + API_CONFIG.viewPath + encodeURIComponent(postId), { method: "POST" }).catch(function () {});
        }
      });
    }, { threshold: 0.55 });
  }

  function renderFeed() {
    updateHeaderCounters();
    setupObservers();

    if (state.error) {
      var errBox = document.createElement("div");
      errBox.className = "empty-box";
      var h2 = document.createElement("h2");
      h2.textContent = "Feed load nahi ho paya";
      var p = document.createElement("p");
      p.textContent = state.error;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn";
      btn.textContent = "Retry";
      btn.addEventListener("click", function () { loadBackendFeed(true); });
      errBox.appendChild(h2);
      errBox.appendChild(p);
      errBox.appendChild(btn);
      feedContainer.replaceChildren(errBox);
      endNote.hidden = true;
      return;
    }

    var posts = getFilteredPosts();
    if (!posts.length) {
      var empty = document.createElement("div");
      empty.className = "empty-box";
      var eh = document.createElement("h2");
      eh.textContent = "No matching media since 25 Nov 2026";
      var ep = document.createElement("p");
      ep.textContent = "Only verified photos and videos posted from 25 Nov 2026 onwards appear here, latest first.";
      empty.appendChild(eh);
      empty.appendChild(ep);
      if (state.filter !== "all" || state.tagFilter) {
        var clr = document.createElement("button");
        clr.type = "button";
        clr.className = "btn";
        clr.textContent = "Show all posts";
        clr.addEventListener("click", function () {
          state.filter = "all";
          state.tagFilter = "";
          renderFeed();
        });
        empty.appendChild(clr);
      }
      feedContainer.replaceChildren(empty);
      endNote.hidden = true;
      return;
    }

    var listEl = document.createElement("div");
    listEl.className = state.view === "grid" ? "grid-view" : "stream";

    for (var i = 0; i < posts.length; i++) {
      listEl.appendChild(state.view === "grid" ? buildGridTile(posts[i]) : buildStreamCard(posts[i], false, i));
    }

    feedContainer.replaceChildren(listEl);
    updateGlobalMuteUI();
    updateSeoSchema(posts);
    endNote.hidden = false;
    endNote.textContent = "Showing " + posts.length + " photos & videos (latest first, since 25 Nov 2026) · falconspido.com";
  }

  // Controls Wiring
  document.querySelectorAll("[data-filter]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.filter = btn.getAttribute("data-filter") || "all";
      renderFeed();
    });
  });

  document.querySelectorAll("[data-view]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.view = btn.getAttribute("data-view") || "stream";
      renderFeed();
    });
  });

  tagClearBtn.addEventListener("click", function () {
    state.tagFilter = "";
    renderFeed();
  });

  globalMuteBtn.addEventListener("click", function () {
    state.muted = !state.muted;
    localStorage.setItem("falconspido_feed_muted", String(state.muted));
    updateGlobalMuteUI();
    showToast(state.muted ? "Sound muted" : "Sound unmuted");
  });

  refreshBtn.addEventListener("click", function () { loadBackendFeed(true); });
  document.getElementById("brandTop").addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  lightboxModal.addEventListener("click", function (e) {
    if (e.target === lightboxModal) closeLightbox();
  });
  document.getElementById("commentsClose").addEventListener("click", function () {
    commentsModal.classList.remove("open");
  });
  commentsModal.addEventListener("click", function (e) {
    if (e.target === commentsModal) commentsModal.classList.remove("open");
  });

  scrollTopBtn.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  window.addEventListener("scroll", function () {
    scrollTopBtn.classList.toggle("show", window.scrollY > 420);
  }, { passive: true });

  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === "Escape") {
      closeLightbox();
      commentsModal.classList.remove("open");
      return;
    }
    if (e.key === "m" || e.key === "M") {
      globalMuteBtn.click();
      return;
    }
    if ((e.key === "j" || e.key === "k") && state.view === "stream") {
      var cards = Array.prototype.slice.call(document.querySelectorAll(".stream .card"));
      if (!cards.length) return;
      var cur = cards.findIndex(function (c) { return c.getBoundingClientRect().top >= 60; });
      if (cur === -1) cur = 0;
      var next = e.key === "j" ? Math.min(cards.length - 1, cur + 1) : Math.max(0, cur - 1);
      cards[next].scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });

  updateGlobalMuteUI();
  loadBackendFeed(false);
})();
</script>
</body>
</html>
