<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#0d2038;--mute:#53647c;--line:#dbe3ee;--blue:#1d4ed8;--blue-d:#173fb0;--sun:#ffc533;--ok:#0b8a5b;--heart:#e11d48;--soft:#eaf0f8}
@media(prefers-color-scheme:dark){:root{--bg:#0a1424;--card:#111f36;--ink:#eaf1fb;--mute:#9db0c8;--line:#22344f;--blue:#5b8cff;--blue-d:#82a6ff;--ok:#3ddc97;--heart:#fb7185;--soft:#182946}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.55 "Hanken Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Hanken Grotesk",sans-serif;line-height:1.2;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
img,video{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.post-shell{max-width:740px;margin:0 auto;padding:22px 16px 12px}
.related-shell{max-width:1040px;margin:18px auto 0;padding:0 16px 64px}

header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.brand-row{display:flex;align-items:center;gap:16px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem "Bricolage Grotesque",sans-serif;flex:none}
.brand i{font-style:normal;color:var(--blue)}
.brand svg{flex:none}
.top-nav{display:flex;align-items:center;gap:14px;font-size:.92rem;font-weight:600;color:var(--mute)}
.top-nav a:hover{color:var(--ink)}
@media(max-width:640px){.top-nav{display:none}}

.nav-actions{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:0}
.pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.84rem;font-weight:700;color:var(--ink);transition:border-color .15s,transform .15s;white-space:nowrap}
.pill-btn:hover{border-color:var(--blue);transform:translateY(-1px)}

.crumb-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--mute);flex-wrap:wrap}
.crumbs a:hover{color:var(--blue);text-decoration:underline}
.crumbs span[aria-hidden="true"]{opacity:.5}
.status-pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:700;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);flex:none}
.dot.is-err{background:var(--heart);box-shadow:0 0 0 3px color-mix(in srgb,var(--heart) 22%,transparent)}

.post-card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 32px rgba(13,32,56,.06)}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--soft);flex:none}
.avatar-fallback{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2f6bff,#102a8f);color:#fff;display:grid;place-items:center;font:800 1.05rem "Bricolage Grotesque",sans-serif;flex:none}
.creator{min-width:0;flex:1}
.creator-row{display:flex;align-items:center;gap:6px}
.username{font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbadge{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;font-size:9px;flex:none}
.subline{font-size:.82rem;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.type-badge{font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--mute);flex:none}
.type-badge.is-video{background:color-mix(in srgb,var(--sun) 30%,var(--soft));color:var(--ink)}

.stage{position:relative;background:#050b16;display:grid;place-items:center;overflow:hidden;min-height:240px}
.stage video,.stage img{width:100%;max-height:72vh;object-fit:contain;background:#050b16}
.stage.is-photo{cursor:zoom-in}
.stage-top{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:4}
.pill-ctrl{background:rgba(10,20,36,.75);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:6px 11px;font-size:.78rem;font-weight:700;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.18)}
.dur-badge{position:absolute;top:12px;left:12px;background:rgba(10,20,36,.75);backdrop-filter:blur(6px);color:#fff;font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:8px;pointer-events:none;z-index:4}

.post-body{padding:18px 20px 14px}
.post-h1{font-size:clamp(1.25rem,3.2vw,1.65rem);font-weight:800;margin-bottom:8px;color:var(--ink)}
.post-desc{color:var(--mute);font-size:.97rem;line-height:1.6;margin-bottom:12px;white-space:pre-line}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag-pill{background:var(--soft);color:var(--blue);font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;transition:background .15s}
.tag-pill:hover{background:color-mix(in srgb,var(--blue) 14%,var(--soft))}

.interact-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.interact-left{display:flex;align-items:center;gap:18px}
.act-btn{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;font-weight:700;color:var(--ink);padding:4px 2px;transition:transform .12s,color .15s}
.act-btn:active{transform:scale(.94)}
.act-btn svg{width:20px;height:20px}
.act-btn.liked{color:var(--heart)}
.act-btn.liked svg{fill:var(--heart);stroke:var(--heart)}
.views-stat{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;color:var(--mute)}
.views-stat svg{width:17px;height:17px}
.share-btn{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--blue);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 12px}
.share-btn:hover{border-color:var(--blue)}
.share-btn svg{width:15px;height:15px}

.comments-wrap{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.comment-form{display:flex;gap:8px;margin-bottom:14px}
.comment-input{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:.92rem}
.comment-input:focus{outline:none;border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;font-weight:700;padding:9px 18px;border-radius:10px;font-size:.9rem;transition:background .15s,transform .15s}
.btn:hover{background:var(--blue-d);transform:translateY(-1px)}
@media(prefers-color-scheme:dark){.btn{color:#06122a}}
.comment-list{display:flex;flex-direction:column;gap:10px}
.comment-item{background:var(--soft);border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
.comment-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2f6bff,#102a8f);color:#fff;display:grid;place-items:center;font:800 .78rem "Bricolage Grotesque",sans-serif;flex:none}
.comment-user{font-weight:700;font-size:.86rem}
.comment-text{font-size:.92rem;color:var(--ink);margin-top:2px}
.comment-empty{font-size:.88rem;color:var(--mute);padding:4px 2px}

.feed-back-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.feed-back-link{color:var(--blue);font-weight:700;font-size:.92rem}
.feed-back-link:hover{text-decoration:underline}

.related-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.related-head h2{font-size:1.3rem;font-weight:800}
.related-head span{font-size:.84rem;color:var(--mute)}
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.related-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.related-grid{grid-template-columns:1fr}}
.rel-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .18s,transform .18s,box-shadow .18s}
.rel-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 10px 24px rgba(13,32,56,.08)}
.rel-media{position:relative;aspect-ratio:16/10;background:#081120;overflow:hidden}
.rel-media img,.rel-media video{width:100%;height:100%;object-fit:cover}
.rel-badge{position:absolute;top:8px;right:8px;background:rgba(10,20,36,.78);color:#fff;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:7px}
.rel-body{padding:11px 12px;display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-between}
.rel-title{font-weight:700;font-size:.9rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rel-stats{display:flex;align-items:center;gap:10px;font-size:.76rem;color:var(--mute);font-weight:600}

.skel-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.pulse{background:linear-gradient(90deg,var(--soft) 25%,color-mix(in srgb,var(--line) 70%,var(--soft)) 50%,var(--soft) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-line{height:14px;border-radius:7px;margin-bottom:10px}
.skel-box{height:360px;border-radius:14px}

.empty-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:38px 22px;text-align:center}
.empty-box h1{font-size:1.4rem;margin-bottom:8px}
.empty-box p{color:var(--mute);max-width:46ch;margin:0 auto 18px}

.modal{position:fixed;inset:0;z-index:80;background:rgba(5,10,20,.86);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.lightbox-img{max-width:94vw;max-height:88vh;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.lightbox-close{position:fixed;top:16px;right:16px;width:42px;height:42px;border-radius:50%;background:rgba(15,23,42,.82);color:#fff;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:20px;z-index:90}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.86rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--line);padding:26px 16px;color:var(--mute);font-size:.86rem;text-align:center}
.foot-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:8px;font-weight:600}
.foot-links a:hover{color:var(--ink);text-decoration:underline}
</style>
</head>

<script>
(function () {
  "use strict";

  var VERCEL_BACKEND_API = "https://backend-k.vercel.app";
  var SITE_ORIGIN = "https://www.falconspido.com";
  var DEFAULT_COVER = SITE_ORIGIN + "/assets/AutoClip_Topmate_Cover_1280x720.png";
  var SITE_LOGO = SITE_ORIGIN + "/assets/AutoClip_Topmate_Thumbnail_600x600.png";

  var params = new URLSearchParams(window.location.search);
  var queryApi = (params.get("api") || "").trim();
  var API_BASE = (queryApi || (params.get("local") === "1" ? "http://localhost:4000" : VERCEL_BACKEND_API)).replace(/\/+$/, "");

  function extractPostIdFromUrl() {
    var qId = (params.get("id") || "").trim();
    if (qId) return qId;
    var m = window.location.pathname.match(/\/post\/([^/?#]+)/i);
    if (m && m[1]) return decodeURIComponent(m[1]);
    return "";
  }

  var HAS_SSR_POST = Boolean(window.__INITIAL_SINGLE_POST__ && window.__INITIAL_SINGLE_POST__._id) && !queryApi;

  var postContainer = document.getElementById("postContainer");
  var relatedAside = document.getElementById("relatedAside");
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");
  var crumbCurrent = document.getElementById("crumbCurrent");
  var toastEl = document.getElementById("toast");
  var lightboxModal = document.getElementById("lightboxModal");
  var lightboxInner = document.getElementById("lightboxInner");

  var state = {
    postId: extractPostIdFromUrl(),
    post: null,
    related: [],
    liked: false,
    showComments: true,
    muted: localStorage.getItem("falconspido_feed_muted") !== "false"
  };

  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  function safeUrl(raw) {
    if (!raw || typeof raw !== "string") return "";
    var s = raw.trim();
    if (/^https?:\/\//i.test(s)) return s;
    if (s.startsWith("/videos/") || s.startsWith("/assets/")) return s;
    if (s.startsWith("/")) return API_BASE + s;
    return "";
  }

  function toAbsMedia(u) {
    if (!u) return "";
    if (/^https?:\/\//i.test(u)) return u;
    if (u.startsWith("/")) return SITE_ORIGIN + u;
    return "";
  }

  function formatDuration(sec) {
    var s = Math.max(0, Math.round(sec || 0));
    if (!s) return "";
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function formatIsoDuration(sec) {
    var s = Math.max(0, Math.round(sec || 0));
    if (!s) return undefined;
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var r = s % 60;
    return "PT" + (h ? h + "H" : "") + (m ? m + "M" : "") + (r || (!h && !m) ? r + "S" : "");
  }

  function formatDateDisplay(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Kolkata" });
  }

  function formatCount(n) {
    n = Number(n || 0);
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  function normalizePost(raw) {
    if (!raw || !raw._id) return null;
    var mediaUrl = safeUrl(raw.media || raw.mediaUrl || (raw.medias && raw.medias.url) || "");
    if (!mediaUrl || /(youtube\.com|youtu\.be)/i.test(mediaUrl)) return null;

    var mt = String(raw.mediaType || "").toLowerCase();
    var isVideo = mt.startsWith("video") || /\.(mp4|mov|webm|mkv|m4v)(\?|#|$)/i.test(mediaUrl);
    var isPhoto = !isVideo && (mt.startsWith("image") || /\.(jpe?g|png|webp|gif|avif|bmp|svg)(\?|#|$)/i.test(mediaUrl));
    if (!isVideo && !isPhoto) return null;

    var tags = Array.isArray(raw.tags)
      ? raw.tags.map(function (t) { return String(t || "").replace(/^#+/, "").trim(); }).filter(Boolean)
      : (Array.isArray(raw.hashtags) ? raw.hashtags.map(function (h) { return String(h || "").replace(/^#+/, "").trim(); }).filter(Boolean) : []);

    var createdMs = Date.parse(raw.createdAt);
    if (!isFinite(createdMs) && /^[a-f0-9]{24}$/i.test(String(raw._id))) {
      createdMs = parseInt(String(raw._id).slice(0, 8), 16) * 1000;
    }

    return {
      id: String(raw._id),
      kind: isVideo ? "video" : "image",
      mediaUrl: mediaUrl,
      thumbUrl: safeUrl(raw.thumbnail || (isPhoto ? mediaUrl : "")),
      title: String(raw.title || "").trim() || ("Latest " + (isVideo ? "Video" : "Photo") + " on falconspido.com"),
      description: String(raw.description || "").trim(),
      tags: tags,
      location: String(raw.location || "").trim(),
      duration: Number(raw.duration || 0),
      width: Number(raw.width || 1280),
      height: Number(raw.height || 720),
      views: Number(raw.views || 0),
      likesCount: Array.isArray(raw.likes) ? raw.likes.length : Number(raw.likes || 0),
      comments: Array.isArray(raw.comments) ? raw.comments : [],
      createdAt: raw.createdAt || (isFinite(createdMs) ? new Date(createdMs).toISOString() : new Date().toISOString()),
      updatedAt: raw.updatedAt || raw.createdAt || (isFinite(createdMs) ? new Date(createdMs).toISOString() : new Date().toISOString()),
      user: {
        username: String((raw.userId && (raw.userId.username || raw.userId.name)) || "falconspido"),
        avatar: safeUrl(raw.userId && (raw.userId.profilePicture || raw.userId.profilePic || raw.userId.avatar)),
        verified: Boolean(raw.userId && (raw.userId.isVerified || raw.userId.isEmailVerified))
      }
    };
  }

  function getPostHref(postId) {
    var qs = queryApi ? ("?api=" + encodeURIComponent(queryApi)) : "";
    return "/post/" + encodeURIComponent(postId) + qs;
  }

  function getCanonicalPostUrl(postId) {
    return SITE_ORIGIN + "/post/" + encodeURIComponent(postId);
  }

  function buildHighCtrDescription(p) {
    var verb = p.kind === "video" ? "watch" : "view";
    var snippet = p.description ? (p.description.slice(0, 110) + " — ") : "";
    return "🔥 " + p.views + " Views, " + p.likesCount + " Likes, " + p.comments.length + " Comments — "
      + snippet + verb + ' "' + p.title + '" uploaded by ' + p.user.username + " on falconspido.com.";
  }

  function extractKeywords(p) {
    if (p.tags && p.tags.length) return p.tags.join(", ");
    return p.title.split(/\s+/).filter(Boolean).slice(0, 10).join(", ");
  }

  function setMeta(id, attr, val) {
    var el = document.getElementById(id);
    if (!el) return;
    if (val) el.setAttribute(attr, val);
    else el.removeAttribute(attr);
  }

  function applyPostSeo(p) {
    var pageUrl = getCanonicalPostUrl(p.id);
    var titleTag = p.title + " - falconspido.com";
    var desc = buildHighCtrDescription(p);
    var kw = extractKeywords(p);
    var absMedia = toAbsMedia(p.mediaUrl) || p.mediaUrl;
    var absThumb = toAbsMedia(p.thumbUrl) || DEFAULT_COVER;
    if (p.kind === "image" && /^https?:\/\//i.test(absMedia)) absThumb = absMedia;

    document.title = titleTag;
    crumbCurrent.textContent = p.kind === "video" ? "Video" : "Photo";

    setMeta("metaDesc", "content", desc);
    setMeta("metaKeywords", "content", kw);
    setMeta("canonicalLink", "href", pageUrl);

    setMeta("ogTypeMeta", "content", p.kind === "video" ? "video.other" : "article");
    setMeta("ogUrlMeta", "content", pageUrl);
    setMeta("ogTitleMeta", "content", titleTag);
    setMeta("ogDescMeta", "content", desc);
    setMeta("ogImageMeta", "content", absThumb);
    setMeta("ogImageAltMeta", "content", p.title);

    if (p.kind === "video") {
      setMeta("ogVideoMeta", "content", absMedia);
      setMeta("ogVideoTypeMeta", "content", "video/mp4");
      setMeta("ogVideoWidthMeta", "content", String(p.width || 1280));
      setMeta("ogVideoHeightMeta", "content", String(p.height || 720));
      setMeta("twCardMeta", "content", "player");
      setMeta("twPlayerMeta", "content", absMedia);
    } else {
      setMeta("ogVideoMeta", "content", "");
      setMeta("ogVideoTypeMeta", "content", "");
      setMeta("ogVideoWidthMeta", "content", "");
      setMeta("ogVideoHeightMeta", "content", "");
      setMeta("twCardMeta", "content", "summary_large_image");
      setMeta("twPlayerMeta", "content", "");
    }

    setMeta("twTitleMeta", "content", titleTag);
    setMeta("twDescMeta", "content", desc);
    setMeta("twImageMeta", "content", absThumb);

    var interactionStatistic = [
      { "@type": "InteractionCounter", interactionType: { "@type": "LikeAction" }, userInteractionCount: p.likesCount },
      { "@type": "InteractionCounter", interactionType: { "@type": "CommentAction" }, userInteractionCount: p.comments.length },
      { "@type": "InteractionCounter", interactionType: { "@type": "WatchAction" }, userInteractionCount: p.views }
    ];

    var publisherObj = {
      "@type": "Organization",
      name: "falconspido.com",
      url: SITE_ORIGIN,
      logo: {
        "@type": "ImageObject",
        url: SITE_LOGO,
        width: 600,
        height: 600
      }
    };

    var mediaSchema;
    if (p.kind === "video") {
      mediaSchema = {
        "@type": "VideoObject",
        "@id": pageUrl + "#video",
        url: pageUrl,
        name: p.title,
        headline: p.title,
        description: desc,
        thumbnailUrl: absThumb,
        contentUrl: absMedia,
        embedUrl: pageUrl,
        uploadDate: new Date(p.createdAt).toISOString(),
        datePublished: new Date(p.createdAt).toISOString(),
        dateModified: new Date(p.updatedAt).toISOString(),
        duration: formatIsoDuration(p.duration),
        width: p.width || 1280,
        height: p.height || 720,
        encodingFormat: "video/mp4",
        publisher: publisherObj,
        author: { "@type": "Person", name: p.user.username },
        creator: { "@type": "Person", name: p.user.username },
        interactionStatistic: interactionStatistic,
        keywords: kw,
        isFamilyFriendly: true,
        potentialAction: { "@type": "WatchAction", target: pageUrl },
        mainEntityOfPage: { "@type": "WebPage", "@id": pageUrl }
      };
    } else {
      mediaSchema = {
        "@type": "ImageObject",
        "@id": pageUrl + "#image",
        url: pageUrl,
        name: p.title,
        headline: p.title,
        description: desc,
        contentUrl: absMedia,
        thumbnailUrl: absThumb,
        datePublished: new Date(p.createdAt).toISOString(),
        dateModified: new Date(p.updatedAt).toISOString(),
        publisher: publisherObj,
        author: { "@type": "Person", name: p.user.username },
        interactionStatistic: interactionStatistic,
        keywords: kw,
        isFamilyFriendly: true,
        potentialAction: { "@type": "ViewAction", target: pageUrl },
        mainEntityOfPage: { "@type": "WebPage", "@id": pageUrl }
      };
    }

    var schemaEl = document.getElementById("postSchemaJsonLd");
    if (schemaEl) {
      schemaEl.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "@id": SITE_ORIGIN + "/#website", name: "falconspido.com", url: SITE_ORIGIN },
          {
            "@type": "BreadcrumbList",
            "@id": pageUrl + "#breadcrumb",
            itemListElement: [
              { "@type": "ListItem", position: 1, name: "Home", item: SITE_ORIGIN + "/" },
              { "@type": "ListItem", position: 2, name: "Feed", item: SITE_ORIGIN + "/feed" },
              { "@type": "ListItem", position: 3, name: p.title, item: pageUrl }
            ]
          },
          mediaSchema
        ]
      });
    }
  }

  function renderSkeleton() {
    postContainer.innerHTML =
      '<div class="skel-card">'
      + '<div class="skel-line pulse" style="width:38%"></div>'
      + '<div class="skel-box pulse"></div>'
      + '<div class="skel-line pulse" style="width:72%;margin-top:16px"></div>'
      + '</div>';
  }

  function makeSvg(pathHtml, viewBox, strokeFill) {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", viewBox || "0 0 24 24");
    if (strokeFill) {
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
    }
    svg.innerHTML = pathHtml;
    return svg;
  }

  function openLightbox(p) {
    lightboxInner.innerHTML = "";
    var img = document.createElement("img");
    img.className = "lightbox-img";
    img.src = p.mediaUrl;
    img.alt = p.title;
    lightboxInner.appendChild(img);
    lightboxModal.classList.add("open");
  }

  function closeLightbox() {
    lightboxModal.classList.remove("open");
    lightboxInner.innerHTML = "";
  }

      var av = document.createElement("img");

      av.src = p.user.avatar;

      av.onerror = function () { av.style.display = "none"; };

    head.appendChild(creator);

    var badge = document.createElement("span");
    badge.className = "type-badge" + (p.kind === "video" ? " is-video" : "");

    head.appendChild(badge);
    article.appendChild(head);

    var stage = document.createElement("div");
    stage.className = "stage " + (p.kind === "video" ? "is-video" : "is-photo");

    if (p.kind === "video") {
      var video = document.createElement("video");
      video.controls = true;
      video.playsInline = true;
      video.preload = "metadata";
      video.muted = state.muted;
      if (p.thumbUrl) video.poster = p.thumbUrl;
      var source = document.createElement("source");
      source.src = p.mediaUrl;
      source.type = "video/mp4";
      video.appendChild(source);
      stage.appendChild(video);

      if (p.duration > 0) {
        var dur = document.createElement("span");
        dur.className = "dur-badge";
        dur.textContent = formatDuration(p.duration);
        stage.appendChild(dur);
      }

      var topCtrls = document.createElement("div");
      topCtrls.className = "stage-top";
      var muteBtn = document.createElement("button");
      muteBtn.type = "button";
      muteBtn.className = "pill-ctrl";
      muteBtn.textContent = state.muted ? "🔇 Muted" : "🔊 Sound";
      muteBtn.addEventListener("click", function () {
        state.muted = !state.muted;
        video.muted = state.muted;
        localStorage.setItem("falconspido_feed_muted", String(state.muted));
        muteBtn.textContent = state.muted ? "🔇 Muted" : "🔊 Sound";
      });
      topCtrls.appendChild(muteBtn);
      stage.appendChild(topCtrls);
    } else {
      var img = document.createElement("img");
      img.src = p.mediaUrl;
      img.alt = p.title;
      stage.appendChild(img);

      var zoomTop = document.createElement("div");
      zoomTop.className = "stage-top";
      var zoomBtn = document.createElement("button");
      zoomBtn.type = "button";
      zoomBtn.className = "pill-ctrl";
      zoomBtn.textContent = "⤢ Full View";
      zoomBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        openLightbox(p);
      });
      zoomTop.appendChild(zoomBtn);
      stage.appendChild(zoomTop);

      stage.addEventListener("click", function () { openLightbox(p); });
    }
    article.appendChild(stage);

    var body = document.createElement("div");
    body.className = "post-body";

    var h1 = document.createElement("h1");
    h1.className = "post-h1";
    h1.textContent = p.title;
    body.appendChild(h1);

    if (p.description) {
      var desc = document.createElement("p");
      desc.className = "post-desc";
      desc.textContent = p.description;
      body.appendChild(desc);
    }

    if (p.tags && p.tags.length) {
      var tagsRow = document.createElement("div");
      tagsRow.className = "tags-row";
      p.tags.forEach(function (t) {
        var a = document.createElement("a");
        a.className = "tag-pill";
        a.href = "/feed?tag=" + encodeURIComponent(t);
        a.textContent = "#" + t;
        tagsRow.appendChild(a);
      });
      body.appendChild(tagsRow);
    }

    var bar = document.createElement("div");
    bar.className = "interact-bar";

    var left = document.createElement("div");
    left.className = "interact-left";

    var likeBtn = document.createElement("button");
    likeBtn.type = "button";
    likeBtn.className = "act-btn" + (state.liked ? " liked" : "");
    var likeSvg = makeSvg('<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>', "0 0 24 24", true);
    var likeCnt = document.createElement("span");
    likeCnt.id = "likeCountVal";
    likeCnt.textContent = formatCount(p.likesCount + (state.liked ? 1 : 0));
    likeBtn.appendChild(likeSvg);
    likeBtn.appendChild(likeCnt);
    likeBtn.addEventListener("click", function () { handleLike(p, likeBtn, likeCnt); });
    left.appendChild(likeBtn);

    var cmtBtn = document.createElement("button");
    cmtBtn.type = "button";
    cmtBtn.className = "act-btn";
    var cmtSvg = makeSvg('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', "0 0 24 24", true);
    var cmtCnt = document.createElement("span");
    cmtCnt.id = "commentCountVal";
    cmtCnt.textContent = formatCount(p.comments.length);
    cmtBtn.appendChild(cmtSvg);
    cmtBtn.appendChild(cmtCnt);
    cmtBtn.addEventListener("click", function () {
      state.showComments = !state.showComments;
      cmtWrap.hidden = !state.showComments;
    });
    left.appendChild(cmtBtn);

    var viewsStat = document.createElement("span");
    viewsStat.className = "views-stat";
    var eyeSvg = makeSvg('<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>', "0 0 24 24", true);
    var viewSpan = document.createElement("span");
    viewSpan.textContent = formatCount(p.views) + " views";
    viewsStat.appendChild(eyeSvg);
    viewsStat.appendChild(viewSpan);
    left.appendChild(viewsStat);

    bar.appendChild(left);

    var shareBtn = document.createElement("button");
    shareBtn.type = "button";
    shareBtn.className = "share-btn";
    var shSvg = makeSvg('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>', "0 0 24 24", true);
    var shTxt = document.createElement("span");
    shTxt.textContent = "Copy Link";
    shareBtn.appendChild(shSvg);
    shareBtn.appendChild(shTxt);
    shareBtn.addEventListener("click", function () {
      var shareUrl = getCanonicalPostUrl(p.id);
      var sharePayload = p.title + "\n" + shareUrl;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(sharePayload).then(function () {
          showToast("Copied: Title + /post/" + p.id.slice(-6));
        }).catch(function () { showToast(shareUrl); });
      } else {
        showToast(shareUrl);
      }
    });
    bar.appendChild(shareBtn);
    body.appendChild(bar);

    var cmtWrap = document.createElement("div");
    cmtWrap.className = "comments-wrap";
    cmtWrap.hidden = !state.showComments;

    var cForm = document.createElement("form");
    cForm.className = "comment-form";
    var cInput = document.createElement("input");
    cInput.type = "text";
    cInput.className = "comment-input";
    cInput.placeholder = "Write a comment…";
    cInput.setAttribute("aria-label", "Write a comment");
    var cPostBtn = document.createElement("button");
    cPostBtn.type = "submit";
    cPostBtn.className = "btn";
    cPostBtn.textContent = "Post";
    cForm.appendChild(cInput);
    cForm.appendChild(cPostBtn);
    cmtWrap.appendChild(cForm);

    var cList = document.createElement("div");
    cList.className = "comment-list";
    renderCommentsInto(cList, p.comments);
    cmtWrap.appendChild(cList);

    cForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var txt = cInput.value.trim();
      if (!txt) return;
      handleCommentSubmit(p, txt, cInput, cList, cmtCnt);
    });

    body.appendChild(cmtWrap);

    var backRow = document.createElement("div");
    backRow.className = "feed-back-row";
    var feedAnchor = document.createElement("a");
    feedAnchor.className = "feed-back-link";
    feedAnchor.href = "/feed";
    feedAnchor.textContent = "← View all latest photos & videos on Feed";
    var urlBadge = document.createElement("span");
    urlBadge.style.cssText = "font-size:.78rem;color:var(--mute);font-weight:600";
    urlBadge.textContent = "/post/" + p.id;
    backRow.appendChild(feedAnchor);
    backRow.appendChild(urlBadge);
    body.appendChild(backRow);

    article.appendChild(body);
    postContainer.appendChild(article);

  function renderCommentsInto(cList, comments) {
    cList.innerHTML = "";
    if (!comments || !comments.length) {
      var empty = document.createElement("p");
      empty.className = "comment-empty";
      empty.textContent = "No comments yet on this post.";
      cList.appendChild(empty);
      return;
    }
    comments.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "comment-item";
      var uname = (c.userId && (c.userId.username || c.userId.name)) || c.username || "Creator";
      var av = document.createElement("div");
      av.className = "comment-av";
      av.textContent = uname.slice(0, 1).toUpperCase();
      var box = document.createElement("div");
      var uEl = document.createElement("div");
      uEl.className = "comment-user";
      uEl.textContent = uname;
      var tEl = document.createElement("div");
      tEl.className = "comment-text";
      tEl.textContent = c.CommentText || c.text || "";
      box.appendChild(uEl);
      box.appendChild(tEl);
      row.appendChild(av);
      row.appendChild(box);
      cList.appendChild(row);
    });
  }

  function handleLike(p, likeBtn, likeCnt) {
    var token = localStorage.getItem("token");
    if (!token) {
      showToast("Login required to like on API");
      return;
    }
    fetch(API_BASE + "/post/like/" + encodeURIComponent(p.id), {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-auth-token": token }
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data && Array.isArray(data.likes)) {
        p.likesCount = data.likes.length;
        state.liked = !state.liked;
        likeBtn.classList.toggle("liked", state.liked);
        likeCnt.textContent = formatCount(p.likesCount);
      }
    }).catch(function () { showToast("Could not update like"); });
  }

  function handleCommentSubmit(p, txt, cInput, cList, cmtCnt) {
    var token = localStorage.getItem("token");
    if (!token) {
      showToast("Login required to post comment");
      return;
    }
    fetch(API_BASE + "/post/comment/" + encodeURIComponent(p.id), {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-auth-token": token },
      body: JSON.stringify({ CommentText: txt })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data && Array.isArray(data.comments)) {
        p.comments = data.comments;
        cInput.value = "";
        renderCommentsInto(cList, p.comments);
        cmtCnt.textContent = formatCount(p.comments.length);
      }
    }).catch(function () { showToast("Could not submit comment"); });
  }

  function renderRelated(list) {
    relatedAside.innerHTML = "";
    var clean = (list || []).map(normalizePost).filter(function (x) {
      return x && x.id !== state.post.id;
    }).slice(0, 8);
    if (!clean.length) return;

    var head = document.createElement("div");
    head.className = "related-head";
    var h2 = document.createElement("h2");
    h2.textContent = "Related Posts";
    var sub = document.createElement("span");
    sub.textContent = "More photos & videos";
    head.appendChild(h2);
    head.appendChild(sub);
    relatedAside.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "related-grid";
    clean.forEach(function (r) {
      var a = document.createElement("a");
      a.className = "rel-card";
      a.href = getPostHref(r.id);

      var media = document.createElement("div");
      media.className = "rel-media";
      if (r.thumbUrl) {
        var img = document.createElement("img");
        img.src = r.thumbUrl;
        img.alt = r.title;
        img.loading = "lazy";
        media.appendChild(img);
      } else {
        var vid = document.createElement("video");
        vid.src = r.mediaUrl;
        vid.muted = true;
        vid.playsInline = true;
        vid.preload = "metadata";
        media.appendChild(vid);
      }
      var rb = document.createElement("span");
      rb.className = "rel-badge";
      rb.textContent = r.kind === "video" ? "Video" : "Photo";
      media.appendChild(rb);
      a.appendChild(media);

      var rbBody = document.createElement("div");
      rbBody.className = "rel-body";
      var rt = document.createElement("div");
      rt.className = "rel-title";
      rt.textContent = r.title;
      var rs = document.createElement("div");
      rs.className = "rel-stats";
      rs.innerHTML = '<span>♥ ' + formatCount(r.likesCount) + '</span><span>💬 ' + formatCount(r.comments.length) + '</span><span>👁 ' + formatCount(r.views) + '</span>';
      rbBody.appendChild(rt);
      rbBody.appendChild(rs);
      a.appendChild(rbBody);

      grid.appendChild(a);
    });
    relatedAside.appendChild(grid);
  }

  function renderNotFound(msg) {
    statusDot.className = "dot is-err";
    statusText.textContent = "Post not found";
    postContainer.innerHTML =
      '<div class="empty-box">'
      + '<h1>Post not found</h1>'
      + '<p>' + (msg || "This photo or video could not be loaded from Vercel API.") + '</p>'
      + '<a class="btn" href="/feed">Browse Feed</a>'
      + '</div>';
  }

  function applyLoadedData(rawPost, rawRelated, modeLabel) {
    var norm = normalizePost(rawPost);
    if (!norm) {
      renderNotFound("Unsupported media format or unavailable post.");
      return;
    }
    state.post = norm;
    state.related = Array.isArray(rawRelated) ? rawRelated : [];
    state.liked = false;

    statusDot.className = "dot";
    statusText.textContent = (norm.kind === "video" ? "Video Post" : "Photo Post") + " · " + modeLabel;

    applyPostSeo(norm);
    renderPost(norm);
    renderRelated(state.related);
  }

  function loadPost() {
    if (HAS_SSR_POST) {
      applyLoadedData(window.__INITIAL_SINGLE_POST__, window.__INITIAL_RELATED_POSTS__ || [], "Vercel SSR");
      return;
    }

    if (!state.postId) {
      renderNotFound("Missing post ID in URL (/post/<id>).");
      return;
    }

    renderSkeleton();
    statusText.textContent = "Loading from Vercel API…";

    var singleEndpoint = queryApi
      ? (API_BASE + "/post/single/" + encodeURIComponent(state.postId))
      : ("/api/post?id=" + encodeURIComponent(state.postId));

    fetch(singleEndpoint, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("Vercel API HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data || !data.post) throw new Error("Post not found");
        applyLoadedData(data.post, data.related || [], "Vercel API");
      })
      .catch(function (err) {
        renderNotFound(err.message);
      });
  }

  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  lightboxModal.addEventListener("click", function (e) {
    if (e.target === lightboxModal) closeLightbox();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLightbox();
  });

  loadPost();
})();
</script>
</body>
</html>
